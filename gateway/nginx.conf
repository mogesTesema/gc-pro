# ═══════════════════════════════════════════════════════════════
#  Nginx reverse proxy — production configuration
#
#  Routes:
#    /api/*        → aacp-backend:5000  (REST API)
#    /socket.io/*  → aacp-backend:5000  (WebSocket / Socket.IO)
#    /*            → aacp-frontend:80   (React SPA)
# ═══════════════════════════════════════════════════════════════

# ── Worker config ─────────────────────────────────────────────
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # ── Rate limiting (basic DDoS protection) ─────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Upstream definitions ──────────────────────────────────
    upstream backend_api {
        server aacp-backend:5000;
        keepalive 32;
    }

    upstream frontend_app {
        server aacp-frontend:80;
        keepalive 16;
    }

    # ── HTTP server ───────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Max upload size (match Express limit)
        client_max_body_size 10m;

        # ── Security headers ──────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN"      always;
        add_header X-Content-Type-Options "nosniff"  always;
        add_header X-XSS-Protection "1; mode=block"  always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Socket.IO (WebSocket upgrade) ─────────────────────
        location /socket.io/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout for persistent connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── REST API ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── React SPA ─────────────────────────────────────────
        location / {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Connection        "";
        }

        # ── Nginx health check ────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }

    # ── HTTPS server (uncomment when you have SSL certs) ──────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # ... same location blocks as above
    # }
    #
    # Redirect HTTP → HTTPS
    # server {
    #     listen 80;
    #     return 301 https://$host$request_uri;
    # }

    include /etc/nginx/conf.d/*.conf;
}
