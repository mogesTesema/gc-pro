# ─────────────────────────────────────────────────────────────
#  Nginx configuration for the AACP React SPA
#  Handles: SPA routing · gzip · security headers · caching
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Root directory where the React build output lives
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection "1; mode=block"   always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static asset caching ──────────────────────────────────
    # CRA hashes filenames on every build — safe to cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Health check endpoint (used by Docker / load balancers) ─
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── SPA catch-all ─────────────────────────────────────────
    # Every unknown path falls back to index.html so React Router
    # can handle client-side navigation correctly
    location / {
        try_files $uri $uri/ /index.html;
    }
}
